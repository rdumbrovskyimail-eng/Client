name: Check Full Android & Gemini Stack

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  inspect-all-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Query Google Maven & Maven Central
        shell: bash
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import xml.etree.ElementTree as ET
          import os
          from pathlib import Path
          import textwrap

          def get_latest_xml(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      root = ET.fromstring(resp.read())
                      release = root.find("./versioning/release")
                      if release is not None and release.text:
                          return release.text
                      latest = root.find("./versioning/latest")
                      if latest is not None and latest.text:
                          return latest.text
                      # Если нет release/latest, берем последнюю версию из списка
                      versions = root.findall("./versioning/versions/version")
                      if versions:
                          return versions[-1].text
              except Exception as e:
                  return f"error: {e}"
              return "unknown"

          def get_maven_central(group, artifact):
              path = group.replace('.', '/') + '/' + artifact
              url = f"https://repo1.maven.org/maven2/{path}/maven-metadata.xml"
              return get_latest_xml(url)

          def get_google_maven(group, artifact):
              path = group.replace('.', '/') + '/' + artifact
              url = f"https://dl.google.com/android/maven2/{path}/maven-metadata.xml"
              return get_latest_xml(url)

          def get_latest_gradle():
              url = "https://services.gradle.org/versions/current"
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read())
                      return data.get("version", "unknown")
              except Exception as e:
                  return f"error: {e}"

          print("Опрашиваем сервера...")
          
          # Базовый стек
          gradle_ver = get_latest_gradle()
          kotlin_ver = get_maven_central("org.jetbrains.kotlin", "kotlin-stdlib")
          coroutines_ver = get_maven_central("org.jetbrains.kotlinx", "kotlinx-coroutines-core")
          serialization_ver = get_maven_central("org.jetbrains.kotlinx", "kotlinx-serialization-json")
          ktor_ver = get_maven_central("io.ktor", "ktor-client-core")
          genai_ver = get_maven_central("com.google.genai", "google-genai")

          # Android & Compose стек
          agp_ver = get_google_maven("com.android.application", "com.android.application.gradle.plugin")
          activity_compose_ver = get_google_maven("androidx.activity", "activity-compose")
          compose_bom_ver = get_google_maven("androidx.compose", "compose-bom")
          compose_ui_ver = get_google_maven("androidx.compose.ui", "ui")
          compose_m3_ver = get_google_maven("androidx.compose.material3", "material3")

          # Формируем libs.versions.toml
          toml_content = textwrap.dedent(f"""\
          [versions]
          # Kotlin & Core
          kotlin = "{kotlin_ver}"
          coroutines = "{coroutines_ver}"
          serialization = "{serialization_ver}"
          ktor = "{ktor_ver}"
          google-genai = "{genai_ver}"

          # Android & Compose
          agp = "{agp_ver}"
          activity-compose = "{activity_compose_ver}"
          compose-bom = "{compose_bom_ver}"

          [libraries]
          # Kotlinx & Gemini
          kotlinx-coroutines-core = {{ module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }}
          kotlinx-serialization-json = {{ module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }}
          ktor-client-core = {{ module = "io.ktor:ktor-client-core", version.ref = "ktor" }}
          ktor-client-cio = {{ module = "io.ktor:ktor-client-cio", version.ref = "ktor" }}
          ktor-client-content-negotiation = {{ module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }}
          ktor-serialization-kotlinx-json = {{ module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }}
          google-genai = {{ module = "com.google.genai:google-genai", version.ref = "google-genai" }}

          # Android UI
          androidx-activity-compose = {{ module = "androidx.activity:activity-compose", version.ref = "activity-compose" }}
          androidx-compose-bom = {{ module = "androidx.compose:compose-bom", version.ref = "compose-bom" }}
          androidx-compose-ui = {{ module = "androidx.compose.ui:ui" }}
          androidx-compose-material3 = {{ module = "androidx.compose.material3:material3" }}

          [plugins]
          android-application = {{ id = "com.android.application", version.ref = "agp" }}
          kotlin-android = {{ id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }}
          kotlin-compose = {{ id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }}
          kotlin-serialization = {{ id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }}
          """)

          # Формируем SUMMARY.md
          summary_content = textwrap.dedent(f"""\
          # 📱 Новейший объединенный стек Android + Gemini Client

          | Категория | Компонент | Источник | Актуальная версия |
          | :--- | :--- | :--- | :--- |
          | **Build System** | Gradle | Gradle Services | `{gradle_ver}` |
          | **Build System** | Android Gradle Plugin (AGP) | Google Maven | `{agp_ver}` |
          | **Language** | Kotlin | Maven Central | `{kotlin_ver}` |
          | **Android UI** | Activity Compose | Google Maven | `{activity_compose_ver}` |
          | **Android UI** | Compose BOM | Google Maven | `{compose_bom_ver}` |
          | **Android UI** | Compose Material3 (Standalone) | Google Maven | `{compose_m3_ver}` |
          | **Async & Net** | Kotlinx Coroutines | Maven Central | `{coroutines_ver}` |
          | **Async & Net** | Kotlinx Serialization | Maven Central | `{serialization_ver}` |
          | **Async & Net** | Ktor Client | Maven Central | `{ktor_ver}` |
          | **AI SDK** | Google GenAI SDK | Maven Central | `{genai_ver}` |

          ---
          ### 📄 Проверенный libs.versions.toml:
          ```toml
          {toml_content}
          ```
          """)

          out_dir = Path("generated")
          out_dir.mkdir(parents=True, exist_ok=True)

          with open(out_dir / "libs.versions.toml", "w", encoding="utf-8") as f:
              f.write(toml_content)

          with open(out_dir / "SUMMARY.md", "w", encoding="utf-8") as f:
              f.write(summary_content)

          summary_path = os.getenv('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write(summary_content)
                  
          print("Готово!")
          EOF

      - name: Upload Verified Configs
        uses: actions/upload-artifact@v4
        with:
          name: verified-android-gemini-stack
          path: generated/