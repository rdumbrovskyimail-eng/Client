name: Apply Gemini Live fixes

# Запуск: Actions → "Apply Gemini Live fixes" → Run workflow (ветка main).
# Применяет все 30 правок (A1–E2), коммитит их в ту же ветку и запускает "Android CI".
# Повторный запуск безопасен: уже применённые правки пропускаются.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-fixes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Apply fixes
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys

          EDITS = [
              (r'''A1''', r'''app/src/main/java/com/client/app/session/SessionManager.kt''',
               r'''        val aadEnabled = prefs[KEY_AAD_ENABLED] ?: true''',
               r'''        val aadEnabled = prefs[KEY_AAD_ENABLED] ?: false''',
               1, None, None),
              (r'''A1''', r'''app/src/main/java/com/client/app/session/SessionManager.kt''',
               r'''            silenceDurationMs = prefs[KEY_SILENCE_DURATION_MS] ?: 500,''',
               r'''            silenceDurationMs = prefs[KEY_SILENCE_DURATION_MS] ?: 800,''',
               1, None, None),
              (r'''A1''', r'''app/src/main/java/com/client/app/viewmodel/SettingsViewModel.kt''',
               r'''    val aadEnabled: Boolean = true,''',
               r'''    val aadEnabled: Boolean = false,''',
               1, None, None),
              (r'''A1''', r'''app/src/main/java/com/client/app/viewmodel/SettingsViewModel.kt''',
               r'''                            aadEnabled = p[SessionManager.KEY_AAD_ENABLED] ?: true,''',
               r'''                            aadEnabled = p[SessionManager.KEY_AAD_ENABLED] ?: false,''',
               1, None, None),
              (r'''A1''', r'''app/src/main/java/com/client/app/viewmodel/SettingsViewModel.kt''',
               r'''    val silenceDurationMs: Int = 500,''',
               r'''    val silenceDurationMs: Int = 800,''',
               1, None, None),
              (r'''A1''', r'''app/src/main/java/com/client/app/viewmodel/SettingsViewModel.kt''',
               r'''                            silenceDurationMs = p[SessionManager.KEY_SILENCE_DURATION_MS] ?: 500,''',
               r'''                            silenceDurationMs = p[SessionManager.KEY_SILENCE_DURATION_MS] ?: 800,''',
               1, None, None),
              (r'''A2''', r'''app/src/main/java/com/client/app/audio/NativeAudioEngine.kt''',
               r'''if (isBargeInActive || generation != currentPlaybackGeneration) return''',
               r'''if (generation != currentPlaybackGeneration) return''',
               4, None, None),
              (r'''A3''', r'''app/src/main/java/com/client/app/service/LiveSessionForegroundService.kt''',
               r'''            if (!permissionGranted) return false
                      return service.promoteToForeground()''',
               r'''            if (!permissionGranted) return false
                      // Тип microphone уже активен — повторный startForeground() не нужен
                      if ((service.foregroundServiceType and ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE) != 0) return true
                      return service.promoteToForeground()''',
               1, None, None),
              (r'''A4''', r'''app/src/main/java/com/client/app/api/GeminiProtobufLiveClient.kt''',
               r'''                    logManager.e(
                                  "WebSocket:Failure",
                                  "Сбой сокета (HTTP $httpCode): ${t.localizedMessage}. Ответ: $errBody",
                                  t
                              )

                              if (myEpoch != epoch) return
          ''',
               r'''                    if (myEpoch != epoch) {
                                  // Наш собственный close()/cancel() старой сессии — не ошибка
                                  logManager.d("WebSocket:Failure", "Старый сокет закрыт: ${t.localizedMessage}")
                                  return
                              }

                              logManager.e(
                                  "WebSocket:Failure",
                                  "Сбой сокета (HTTP $httpCode): ${t.localizedMessage}. Ответ: $errBody",
                                  t
                              )
          ''',
               1, None, None),
              (r'''B1''', r'''app/src/main/java/com/client/app/session/SessionManager.kt''',
               r'''        audioEngine.isAadMode = aadEnabled
                  audioEngine.setBluetoothHiFiEnabled(prefs[KEY_BT_HIFI_MODE] ?: true)''',
               r'''        audioEngine.isAadMode = aadEnabled
                  audioEngine.setBluetoothHiFiEnabled(prefs[KEY_BT_HIFI_MODE] ?: false)''',
               1, None, None),
              (r'''B1''', r'''app/src/main/java/com/client/app/session/SessionManager.kt''',
               r'''            audioEngine.setBluetoothHiFiEnabled(prefs[KEY_BT_HIFI_MODE] ?: true)''',
               r'''            audioEngine.setBluetoothHiFiEnabled(prefs[KEY_BT_HIFI_MODE] ?: false)''',
               1, None, None),
              (r'''B1''', r'''app/src/main/java/com/client/app/viewmodel/SettingsViewModel.kt''',
               r'''    val btHiFiMode: Boolean = true,''',
               r'''    val btHiFiMode: Boolean = false,''',
               1, None, None),
              (r'''B1''', r'''app/src/main/java/com/client/app/viewmodel/SettingsViewModel.kt''',
               r'''                            btHiFiMode = p[SessionManager.KEY_BT_HIFI_MODE] ?: true,''',
               r'''                            btHiFiMode = p[SessionManager.KEY_BT_HIFI_MODE] ?: false,''',
               1, None, None),
              (r'''B1''', r'''app/src/main/java/com/client/app/audio/AudioDeviceRouter.kt''',
               r'''    @Volatile var bluetoothHiFiEnabled: Boolean = true''',
               r'''    @Volatile var bluetoothHiFiEnabled: Boolean = false''',
               1, None, None),
              (r'''B2''', r'''app/src/main/java/com/client/app/audio/AudioDeviceRouter.kt''',
               r'''            AudioDeviceInfo.TYPE_BLUETOOTH_SCO,
                      AudioDeviceInfo.TYPE_BLE_HEADSET,
                      AudioDeviceInfo.TYPE_BLE_SPEAKER,''',
               r'''            AudioDeviceInfo.TYPE_BLUETOOTH_SCO,
                      AudioDeviceInfo.TYPE_BLUETOOTH_A2DP,
                      AudioDeviceInfo.TYPE_BLE_HEADSET,
                      AudioDeviceInfo.TYPE_BLE_SPEAKER,''',
               1, None, None),
              (r'''B3''', r'''app/src/main/java/com/client/app/audio/NativeAudioEngine.kt''',
               r'''            if (isSameRoute) {
                          logger.d("NativeAudioEngine: applyRouteInternal: Идентичный маршрут уже активен, пересоздание стримов пропущено (No-Op)")
                          return@withContext
                      }''',
               r'''            if (isSameRoute) {
                          // Стримы уже переоткрыты восстановлением, но акустический профиль остался от прежнего маршрута
                          applyAcousticProfileForRoute(req.profile)
                          logger.d("NativeAudioEngine: applyRouteInternal: маршрут уже активен, применён профиль ${req.profile.path}")
                          return@withContext
                      }''',
               1, None, None),
              (r'''B4''', r'''app/src/main/java/com/client/app/ui/screens/ClientScreen.kt''',
               r'''    ) { permissions ->
                  // Старт только если микрофон запрашивали ИМЕННО в этом диалоге и его выдали. Иначе
                  // (запрошены лишь уведомления/Bluetooth при уже выданном микрофоне) повторный
                  // toggleConnection() сразу останавливал только что запущенную сессию.
                  val audioJustGranted = permissions[Manifest.permission.RECORD_AUDIO] == true

                  if (audioJustGranted) {
                      viewModel.toggleConnection()
                  }
              }''',
               r'''    ) { _ ->
                  // Старт после ответа на запрос разрешений: микрофон обязателен, Bluetooth — по возможности.
                  // Только из IDLE, чтобы повторный вызов не остановил уже запущенную сессию.
                  val audioGranted = ContextCompat.checkSelfPermission(
                      context, Manifest.permission.RECORD_AUDIO
                  ) == PackageManager.PERMISSION_GRANTED

                  if (audioGranted && viewModel.state.value.link == com.client.app.session.LinkState.IDLE) {
                      viewModel.toggleConnection()
                  }
              }''',
               1, r'''viewModel.state.value.link == com.client.app.session.LinkState.IDLE''', None),
              (r'''B4''', r'''app/src/main/java/com/client/app/ui/screens/ClientScreen.kt''',
               r'''        if (requiredMissing.isEmpty()) {
                      viewModel.toggleConnection()
                      if (optionalMissing.isNotEmpty()) {
                          permissionsLauncher.launch(optionalMissing.toTypedArray())
                      }
                  } else {
                      permissionsLauncher.launch((requiredMissing + optionalMissing).toTypedArray())
                  }''',
               r'''        // Остановка сессии разрешений не требует
                  if (viewModel.state.value.link != com.client.app.session.LinkState.IDLE) {
                      viewModel.toggleConnection()
                      return
                  }
                  val allMissing = requiredMissing + optionalMissing
                  if (allMissing.isEmpty()) {
                      viewModel.toggleConnection()
                  } else {
                      permissionsLauncher.launch(allMissing.toTypedArray())
                  }''',
               1, r'''val allMissing = requiredMissing + optionalMissing''', r'''fun handleSessionClick()'''),
              (r'''C1''', r'''app/src/main/java/com/client/app/audio/NativeAudioEngine.kt''',
               r'''    fun setMicGain(gain: Float) =
                  bridge.setMicGain(gain.coerceIn(0.5f, 2.0f))''',
               r'''    @Volatile private var userMicGain: Float = 1.0f
              @Volatile private var routeMicCompensation: Float = 1.0f

              fun setMicGain(gain: Float) {
                  userMicGain = gain.coerceIn(0.5f, 2.0f)
                  bridge.setMicGain((userMicGain * routeMicCompensation).coerceIn(0.5f, 2.0f))
              }''',
               1, None, None),
              (r'''C1''', r'''app/src/main/java/com/client/app/audio/NativeAudioEngine.kt''',
               r'''        bridge.setMicGain(quirks.micGainCompensation)''',
               r'''        routeMicCompensation = quirks.micGainCompensation
                  bridge.setMicGain((userMicGain * routeMicCompensation).coerceIn(0.5f, 2.0f))''',
               1, None, None),
              (r'''C2''', r'''app/src/main/java/com/client/app/session/SessionManager.kt''',
               r'''        audioEngine.drainPendingMicOutput()
                  isManualActivityActive.set(false)''',
               r'''        audioEngine.drainPendingMicOutput()
                  // StreamStop слит из очереди вместе с потребителем: реплику закрываем явно
                  if (hasPhysicalCapture && client.isReady) {
                      runCatching { finalizeMicActivityBounded() }
                  }
                  isManualActivityActive.set(false)''',
               1, r'''runCatching { finalizeMicActivityBounded() }''', None),
              (r'''C3''', r'''app/src/main/java/com/client/app/audio/AudioDeviceRouter.kt''',
               r'''            AudioRoutePath.WIRED_HEADSET -> {
                          if (actualInput.type != AudioDeviceInfo.TYPE_WIRED_HEADSET && actualInput.type != AudioDeviceInfo.TYPE_USB_HEADSET) {''',
               r'''            AudioRoutePath.WIRED_HEADSET -> {
                          if (profile.inputDeviceId == 0 && actualInput.type == AudioDeviceInfo.TYPE_BUILTIN_MIC) return true
                          if (actualInput.type != AudioDeviceInfo.TYPE_WIRED_HEADSET && actualInput.type != AudioDeviceInfo.TYPE_USB_HEADSET) {''',
               1, None, None),
              (r'''C3''', r'''app/src/main/java/com/client/app/audio/AudioDeviceRouter.kt''',
               r'''            AudioRoutePath.USB_HEADSET -> {
                          if (actualInput.type != AudioDeviceInfo.TYPE_USB_HEADSET && actualInput.type != AudioDeviceInfo.TYPE_WIRED_HEADSET) {''',
               r'''            AudioRoutePath.USB_HEADSET -> {
                          if (profile.inputDeviceId == 0 && actualInput.type == AudioDeviceInfo.TYPE_BUILTIN_MIC) return true
                          if (actualInput.type != AudioDeviceInfo.TYPE_USB_HEADSET && actualInput.type != AudioDeviceInfo.TYPE_USB_DEVICE && actualInput.type != AudioDeviceInfo.TYPE_WIRED_HEADSET) {''',
               1, None, None),
              (r'''C4''', r'''app/src/main/java/com/client/app/api/SocketCustomizer.kt''',
               r'''            ParcelFileDescriptor.fromSocket(socket)?.use { origPfd ->''',
               r'''            // До API 29 fromSocket() не делает dup: закрытие PFD закрывало сам сокет
                      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.Q) ParcelFileDescriptor.fromSocket(socket)?.use { origPfd ->''',
               1, None, None),
              (r'''D''', r'''app/src/main/java/com/client/app/session/SessionManager.kt''',
               r'''                            is AudioStreamControlEvent.SpeechEnd -> {
                                          if (currentAadEnabled && client.isReady) {''',
               r'''                            is AudioStreamControlEvent.SpeechEnd -> {
                                          logger.d("SessionManager: VAD SpeechEnd -> activityEnd (ушло ${client.getTransportAudioStats().outboundMicBytesDelivered / 32} мс аудио за сессию)")
                                          if (currentAadEnabled && client.isReady) {''',
               1, None, None),
              (r'''D''', r'''app/src/main/java/com/client/app/api/GeminiProtobufLiveClient.kt''',
               r'''                        logManager.net("WebSocket:RxBinary", "Получено ${bytes.size} байт")
                                  parseServerJsonMessage(bytes.utf8(), myEpoch, ws)''',
               r'''                        val text = bytes.utf8()
                                  logManager.net("WebSocket:RxBinary", describeServerFrame(text, bytes.size))
                                  parseServerJsonMessage(text, myEpoch, ws)''',
               1, None, None),
              (r'''D''', r'''app/src/main/java/com/client/app/api/GeminiProtobufLiveClient.kt''',
               r'''    private fun isQuotaClose(code: Int, reason: String): Boolean {''',
               r'''    private fun describeServerFrame(text: String, size: Int): String {
                  val root = runCatching { json.parseToJsonElement(text).jsonObject }.getOrNull()
                      ?: return "Rx $size Б: не JSON"
                  if (root.isEmpty()) return "Rx $size Б: пустой кадр"
                  val parts = mutableListOf<String>()
                  root.keys.filter { it != "serverContent" }.forEach { parts += it }
                  (root["serverContent"] as? JsonObject)?.forEach { (k, v) ->
                      parts += when (k) {
                          "modelTurn" -> "modelTurn[${((v as? JsonObject)?.get("parts") as? JsonArray)?.size ?: 0}]"
                          "inputTranscription", "interimInputTranscription", "outputTranscription" ->
                              "$k='${extractTranscriptText(v).orEmpty().take(80)}'"
                          else -> k
                      }
                  }
                  return "Rx $size Б: ${parts.joinToString()}"
              }

              private fun isQuotaClose(code: Int, reason: String): Boolean {''',
               1, None, None),
              (r'''E1''', r'''app/src/main/java/com/client/app/session/SessionManager.kt''',
               r'''                    systemInstruction = _state.value.activePrompt,''',
               r'''                    systemInstruction = _state.value.activePrompt.trimEnd() + "\n\n" +
                                  "Тебя слушают в реальном времени и могут перебить. Если тебя перебили, " +
                                  "пользователь услышал только начало твоего последнего ответа, а не весь его текст. " +
                                  "Не продолжай с того места, где закончился твой ответ, и не переходи к новой теме: " +
                                  "сначала ответь на то, что сказал пользователь, а если он просит продолжить — " +
                                  "вернись к прерванной мысли и коротко повтори то, что он мог не услышать.",''',
               1, None, None),
              (r'''E2''', r'''app/src/main/java/com/client/app/audio/NativeAudioEngine.kt''',
               r'''            candidateFrames = 3
                      confirmMs = 150L''',
               r'''            candidateFrames = 3
                      confirmMs = 450L''',
               1, None, None),
              (r'''E2''', r'''app/src/main/java/com/client/app/audio/NativeAudioEngine.kt''',
               r'''            candidateFrames = 4
                      confirmMs = 180L''',
               r'''            candidateFrames = 4
                      confirmMs = 450L''',
               1, None, None),
          ]

          changed = set()
          applied = skipped = 0
          errors = []
          cache = {}

          def load(path):
              if path not in cache:
                  if not os.path.isfile(path):
                      raise FileNotFoundError(path)
                  raw = open(path, encoding="utf-8", newline="").read()
                  crlf = "\r\n" in raw
                  cache[path] = [raw.replace("\r\n", "\n"), crlf, raw]
              return cache[path]

          warnings = []
          for sec, path, old, new, n, marker, soft_anchor in EDITS:
              try:
                  entry = load(path)
              except FileNotFoundError:
                  errors.append(f"{sec}: файл не найден: {path}")
                  continue
              text = entry[0]
              if marker and marker in text:
                  print(f"[skip] {sec} {path}: уже применено (ручная редакция)"); skipped += 1; continue
              c_old, c_new = text.count(old), text.count(new)
              if old in new and c_new >= n:
                  print(f"[skip] {sec} {path}: уже применено"); skipped += 1; continue
              if c_old == n:
                  entry[0] = text.replace(old, new); applied += 1
                  print(f"[ok]   {sec} {path}")
                  continue
              if old not in new and c_old == 0 and c_new >= n:
                  print(f"[skip] {sec} {path}: уже применено"); skipped += 1; continue
              if soft_anchor:
                  i = text.find(soft_anchor)
                  ctx = "\n".join(text[i:].split("\n")[:45]) if i >= 0 else "(функция не найдена)"
                  print(f"::warning file={path}::{sec}: код изменён вручную, правка пропущена — сборке не мешает")
                  print(f"[warn] {sec} {path}: пропущено. Текущий код (пришлите его, если нужно сверить):")
                  print("-" * 60 + "\n" + ctx + "\n" + "-" * 60)
                  warnings.append(f"{sec}: {path}")
                  skipped += 1
                  continue
              errors.append(f"{sec}: {path}: фрагмент найден {c_old} раз, ожидалось {n}")

          if errors:
              print("\nОШИБКИ — ни один файл не изменён:")
              for e in errors:
                  print("  - " + e)
              sys.exit(1)

          for path, (text, crlf, raw) in cache.items():
              out = text.replace("\n", "\r\n") if crlf else text
              if out != raw:
                  open(path, "w", encoding="utf-8", newline="").write(out)
                  changed.add(path)

          with open("/tmp/changed_files.txt", "w") as fh:
              fh.write("\n".join(sorted(changed)))

          print(f"\nПрименено: {applied}, уже было/пропущено: {skipped}, изменено файлов: {len(changed)}")
          for w in warnings:
              print("  предупреждение: " + w)
          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a") as fh:
                  fh.write(f"changed={'true' if changed else 'false'}\n")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(f"### Правки Gemini Live\n\nПрименено: {applied}, уже было: {skipped}, изменено файлов: {len(changed)}\n\n")
                  for p in sorted(changed):
                      fh.write(f"- `{p}`\n")

          PY

      - name: Commit and push
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t FILES < /tmp/changed_files.txt
          git add -- "${FILES[@]}"
          git commit -m "Gemini Live: ручной VAD 800 мс, Bluetooth, перебивание, надёжность, диагностика"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Start Android CI
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Push от GITHUB_TOKEN сам не запускает другие workflow, поэтому сборку стартуем явно
          gh workflow run android-build.yml --ref "${{ github.ref_name }}"
          echo "Сборка запущена: Actions → Android CI" >> "$GITHUB_STEP_SUMMARY"
