# >>> FILE: .github/workflows/android-build.yml
name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Предотвращает конфликт параллельных сборок при быстрых пушах
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Устанавливаем официальный CLI Gradle 8.14.3 в окружение runner'а
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      # Динамическая генерация wrapper.jar и перезапись канонического gradlew
      - name: Ensure Gradle Wrapper
        run: |
          echo "▶ Генерация официального Gradle Wrapper 8.14.3..."
          gradle wrapper --gradle-version 8.14.3 --distribution-type bin
          chmod +x gradlew

      - name: Setup Keystore
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.DEBUG_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
          else
            echo "▶ Генерация временного отладочного ключа..."
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --build-cache \
            --max-workers=4 \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      - name: Calculate APK Size
        id: apk_info
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE_BYTES=$(stat -c%s "$APK_PATH")
            SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES / 1048576}")
            echo "apk_size=${SIZE_MB} MB" >> $GITHUB_OUTPUT
            echo "▶ Размер APK: ${SIZE_MB} MB"
          else
            echo "❌ Ошибка: APK не найден!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Gemini Live Ultra v1.0.${{ github.run_number }}"
          make_latest: true
          body: |
            ### 🚀 Gemini Live Ultra (Оптимизировано для Samsung S23 Ultra)
            - **Коммит:** `${{ github.sha }}`
            - **Размер APK:** ${{ steps.apk_info.outputs.apk_size }}
            - **Движок:** Gemini 3.1 Flash Live (`v1beta`) + Sub-40ms Barge-In (Локальный VAD)
            - **Лингвистика:** Автономный Forvo API + Двухуровневый разбор лексики Vision
            
            **Установка:** Скачайте `.apk` ниже и установите на устройство.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}