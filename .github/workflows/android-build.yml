name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "▶ gradle-wrapper.jar не найден в репозитории. Генерируем через Gradle CLI..."
            gradle wrapper --gradle-version 8.14.3 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Validate Gradle Wrapper Integrity
        uses: gradle/actions/wrapper-validation@v4

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --build-cache \
            --max-workers=4 \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      - name: Calculate APK Size
        id: apk_info
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE_BYTES=$(stat -c%s "$APK_PATH")
            SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES / 1048576}")
            echo "apk_size=${SIZE_MB} MB" >> $GITHUB_OUTPUT
            echo "▶ Размер APK: ${SIZE_MB} MB"
          else
            echo "❌ Ошибка: APK не найден!"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Gemini Live Ultra v1.0.${{ github.run_number }}"
          make_latest: true
          body: |
            ### 🚀 Gemini Live Ultra (Galaxy S23 Ultra + CMF Buds 2 Edition)
            - **Коммит:** `${{ github.sha }}`
            - **Размер APK:** ${{ steps.apk_info.outputs.apk_size }}
            - **Аудиоядро:** Гибридный Dual-Path Engine (MMAP Exclusive 4.2 мс $\leftrightarrow$ CMF Buds 2 Low-Latency)
            - **DSP & Ресемплер:** ARM NEON Polyphase Resampler (24 кГц $\leftrightarrow$ 16/48 кГц)
            - **Тактильность & Earcon:** X-Axis LRA Haptics (<3 мс) + Звуковой Earcon Pip (750 Гц)
            - **VAD & Lead-In:** Silero VAD v5 Zero-Allocation + Пре-ролл буфер (160/260 мс)
            - **Сетевой транспорт:** Gemini 3.1 Live WebSocket JSON + 40-мс батчинг + TCP_NOTSENT_LOWAT ядро
            - **Графика:** 120 FPS AGSL SDF Raymarching без варп-дивергенции на Adreno 740
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}