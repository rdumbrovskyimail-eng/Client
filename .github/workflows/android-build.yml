name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      # AUD-070:
      # Enforce that the real Silero V5 binary is present before Gradle
      # can package an APK.
      - name: Fetch and Validate Silero V5 Model
        shell: bash
        run: |
          set -euo pipefail

          MODEL_PATH="app/src/main/assets/models/silero_vad_v5_quant.onnx"

          if [ ! -f "$MODEL_PATH" ]; then
            echo "ERROR: missing $MODEL_PATH"
            exit 1
          fi

          git lfs pull --include="$MODEL_PATH"

          # Verify that HEAD itself contains an LFS pointer.
          POINTER="$(
            git cat-file blob "HEAD:$MODEL_PATH" 2>/dev/null || true
          )"

          case "$POINTER" in
            version\ https://git-lfs.github.com/spec/v1*)
              echo "Verified: repository tracks the model through Git LFS."
              ;;
            *)
              echo "ERROR: $MODEL_PATH is not an LFS-tracked asset at HEAD."
              exit 1
              ;;
          esac

          SIZE_BYTES="$(stat -c%s "$MODEL_PATH")"

          echo "Silero V5 asset size: $SIZE_BYTES bytes"

          # Sanity floor:
          # rejects empty files, tiny placeholders and raw LFS pointer text.
          if [ "$SIZE_BYTES" -lt 500000 ]; then
            echo "ERROR AUD-070: materialized model is implausibly small ($SIZE_BYTES bytes)."
            exit 1
          fi

          if head -c 64 "$MODEL_PATH" |
             grep -q "git-lfs.github.com/spec"; then
            echo "ERROR AUD-070: LFS pointer text was packaged instead of the binary object."
            exit 1
          fi

          echo "Silero model SHA-256:"
          sha256sum "$MODEL_PATH"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "▶ gradle-wrapper.jar не найден в репозитории. Генерируем через Gradle CLI..."
            gradle wrapper --gradle-version 8.14.3 --distribution-type bin
          fi

          chmod +x gradlew

      - name: Validate Gradle Wrapper Integrity
        uses: gradle/actions/wrapper-validation@v4

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --build-cache \
            --max-workers=4 \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      - name: Calculate APK Size
        id: apk_info
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$APK_PATH" ]; then

            SIZE_BYTES="$(stat -c%s "$APK_PATH")"

            SIZE_MB="$(
              awk "BEGIN {
                printf \"%.2f\", $SIZE_BYTES / 1048576
              }"
            )"

            echo "apk_size=${SIZE_MB} MB" >> "$GITHUB_OUTPUT"

            echo "▶ Размер APK: ${SIZE_MB} MB"

          else

            echo "❌ Ошибка: APK не найден!"

            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

        with:
          tag_name: v1.0.${{ github.run_number }}

          name: "Gemini Live Ultra v1.0.${{ github.run_number }}"

          make_latest: true

          body: |
            ### 🚀 Gemini Live Ultra

            - **Коммит:** `${{ github.sha }}`
            - **Размер APK:** ${{ steps.apk_info.outputs.apk_size }}
            - **VAD:** Silero V5 LFS-validated ONNX
            - **Аудиоядро:** AAudio realtime engine + SPSC playback
            - **Playback:** generation-based flush/quiescence
            - **Barge-In:** bounded local recovery
            - **Network:** ordered realtime PCM backpressure
            - **Audio batching:** 40 ms @ 16 kHz PCM16

          files: app/build/outputs/apk/debug/app-debug.apk

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}