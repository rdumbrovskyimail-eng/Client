name: Apply 100% Audio Engine Fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Patch Audio Engine
        shell: python
        run: |
          import re

          # 1. Patch AAudioEngine.cpp
          with open("app/src/main/cpp/audio/AAudioEngine.cpp", "r", encoding="utf-8") as f:
              c = f.read()

          c = re.sub(
              r'outRms_\.store\(\s*outRms,\s*std::memory_order_relaxed\);',
              '// outRms_ moved to playbackCallback for DAC presentation timing',
              c
          )

          old_cb_pat = r'(if\s*\(read\s*<\s*frames\)\s*\{[\s\S]*?engine->leavePlaybackCallback\(\);)'
          new_cb_code = (
              'if (read < frames) {\n'
              '            std::memset(samples + read, 0, (frames - read) * sizeof(int16_t));\n'
              '        }\n\n'
              '        if (read > 0) {\n'
              '            const float dacRms = dsp::calculateRms(samples, read);\n'
              '            engine->outRms_.store(dacRms, std::memory_order_relaxed);\n'
              '        } else {\n'
              '            engine->outRms_.store(0.0f, std::memory_order_relaxed);\n'
              '        }\n\n'
              '        engine->leavePlaybackCallback();'
          )
          c = re.sub(old_cb_pat, new_cb_code, c, count=1)

          with open("app/src/main/cpp/audio/AAudioEngine.cpp", "w", encoding="utf-8") as f:
              f.write(c)
          print("AAudioEngine.cpp successfully patched.")

          # 2. Patch NativeAudioEngine.kt
          with open("app/src/main/java/com/client/app/audio/NativeAudioEngine.kt", "r", encoding="utf-8") as f:
              k = f.read()

          k = re.sub(
              r'private\s+var\s+lastBargeInMs\s*=\s*0L',
              'private var lastBargeInMs = 0L\n\n    @Volatile\n    private var outputEnergyHangover: Float = 0f\n\n    @Volatile\n    private var currentPlaybackVolume: Float = 1.0f',
              k
          )

          old_air_pat = r'val\s+isAiRendering\s*=\s*!isBluetooth\s*&&\s*\(instantaneousOut\s*>\s*0\.035f\)'
          new_air_code = (
              'val pendingFrames = bridge.getPendingPlaybackFrames()\n\n'
              '                        if (instantaneousOut > 0.02f && outputEnergyHangover <= 0.005f) {\n'
              '                            lastPlaybackStartMs = now\n'
              '                        }\n\n'
              '                        outputEnergyHangover = if (!_isPlaying.value || (pendingFrames == 0L && instantaneousOut <= 0.001f)) {\n'
              '                            0f\n'
              '                        } else {\n'
              '                            maxOf(instantaneousOut, outputEnergyHangover * 0.96f)\n'
              '                        }\n\n'
              '                        val isAiRendering = _isPlaying.value && (outputEnergyHangover > 0.015f || pendingFrames > 160L)'
          )
          k = re.sub(old_air_pat, new_air_code, k, count=1)

          k = re.sub(
              r'if\s*\(\s*isVocalized\s*\)\s*\{\s*val\s+canBargeInTimers',
              'if (isVocalized && isAiRendering) {\n                                val canBargeInTimers',
              k, count=1
          )

          old_barge_pat = r'val\s+exceedsAcousticBoundary\s*=\s*if\s*\(isAiRendering\)\s*\{[\s\S]*?for\s*\(pf\s+in\s+preRoll\)\s*\{[\s\S]*?\}\s*\}'
          new_barge_code = (
              'val dynamicErleRatio = 0.72f + (0.15f * currentPlaybackVolume)\n'
              '                                val nonLinearOffset = if (outputEnergyHangover > 0.45f) {\n'
              '                                    (outputEnergyHangover - 0.45f) * 0.40f\n'
              '                                } else {\n'
              '                                    0.0f\n'
              '                                }\n'
              '                                val echoThreshold = maxOf(0.18f, (outputEnergyHangover * dynamicErleRatio) + nonLinearOffset)\n'
              '                                val effectiveThreshold = if (isBluetooth) 0.035f else echoThreshold\n\n'
              '                                if (instantaneousMic > effectiveThreshold) {\n'
              '                                    bargeInCandidateStreak++\n'
              '                                } else {\n'
              '                                    bargeInCandidateStreak = maxOf(0, bargeInCandidateStreak - 1)\n'
              '                                }\n\n'
              '                                val requiredStreak = if (isBluetooth) 3 else 5\n'
              '                                val isConfirmedUserInterruption = (bargeInCandidateStreak >= requiredStreak) && canBargeInTimers\n\n'
              '                                if (isConfirmedUserInterruption) {\n'
              '                                    lastBargeInMs = now\n'
              '                                    bargeInCandidateStreak = 0\n'
              '                                    outputEnergyHangover = 0f\n\n'
              '                                    activateBargeIn(now)\n'
              '                                    hapticManager.triggerBargeIn()\n'
              '                                    _bargeInEvents.tryEmit(Unit)\n\n'
              '                                    if (isBluetooth) {\n'
              '                                        val preRoll = mutableListOf<ByteArray>()\n'
              '                                        synchronized(poolLock) {\n'
              '                                            while (leadInBuffer.isNotEmpty()) {\n'
              '                                                preRoll.add(leadInBuffer.removeFirst())\n'
              '                                            }\n'
              '                                        }\n'
              '                                        for (pf in preRoll) {\n'
              '                                            sendMicEvent(AudioStreamEvent.Audio(pf), instanceId)\n'
              '                                        }\n'
              '                                    } else {\n'
              '                                        synchronized(poolLock) {\n'
              '                                            while (leadInBuffer.isNotEmpty()) {\n'
              '                                                recycleBuffer(leadInBuffer.removeFirst())\n'
              '                                            }\n'
              '                                        }\n'
              '                                    }\n'
              '                                }'
          )
          k = re.sub(old_barge_pat, new_barge_code, k, count=1)

          old_vol_pat = r'fun\s+setVolume\(\s*volume:\s*Float\s*\)\s*=\s*bridge\.setVolume\([\s\S]*?\)'
          new_vol_code = (
              'fun setVolume(volume: Float) {\n'
              '        val clamped = volume.coerceIn(0f, 1f)\n'
              '        currentPlaybackVolume = clamped\n'
              '        bridge.setVolume(clamped)\n'
              '    }'
          )
          k = re.sub(old_vol_pat, new_vol_code, k, count=1)

          k = re.sub(
              r'bargeInTimestampMs\s*=\s*0L\s*bargeInLeaseJob\?\.cancel\(\)',
              'bargeInTimestampMs = 0L\n        outputEnergyHangover = 0f\n        bargeInLeaseJob?.cancel()',
              k
          )

          with open("app/src/main/java/com/client/app/audio/NativeAudioEngine.kt", "w", encoding="utf-8") as f:
              f.write(k)
          print("NativeAudioEngine.kt successfully patched.")

          # 3. Patch SessionManager.kt
          with open("app/src/main/java/com/client/app/session/SessionManager.kt", "r", encoding="utf-8") as f:
              s = f.read()

          s = re.sub(
              r'audioEngine\.bargeInEvents\.collect\s*\{\s*invalidateAndFlushAudio',
              'audioEngine.bargeInEvents.collect {\n            if (!_state.value.isAiSpeaking) return@collect\n            invalidateAndFlushAudio',
              s, count=1
          )

          with open("app/src/main/java/com/client/app/session/SessionManager.kt", "w", encoding="utf-8") as f:
              s.write(s)
          print("SessionManager.kt successfully patched.")

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(audio): apply 100% resilient audio engine fixes" || exit 0
          git push origin main