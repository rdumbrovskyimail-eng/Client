name: Check Latest Kotlin & Gemini Stack

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  inspect-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Query Latest Stack & Generate Files
        shell: bash
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import xml.etree.ElementTree as ET
          import os
          from pathlib import Path
          import textwrap

          def get_latest_maven(group, artifact):
              path = group.replace('.', '/') + '/' + artifact
              url = f"https://repo1.maven.org/maven2/{path}/maven-metadata.xml"
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      root = ET.fromstring(resp.read())
                      release = root.find("./versioning/release")
                      if release is not None and release.text:
                          return release.text
                      latest = root.find("./versioning/latest")
                      if latest is not None and latest.text:
                          return latest.text
              except Exception as e:
                  return f"error: {e}"
              return "unknown"

          def get_latest_gradle():
              url = "https://services.gradle.org/versions/current"
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read())
                      return data.get("version", "unknown")
              except Exception as e:
                  return f"error: {e}"

          # Сбор версий
          gradle_ver = get_latest_gradle()
          kotlin_ver = get_latest_maven("org.jetbrains.kotlin", "kotlin-stdlib")
          coroutines_ver = get_latest_maven("org.jetbrains.kotlinx", "kotlinx-coroutines-core")
          serialization_ver = get_latest_maven("org.jetbrains.kotlinx", "kotlinx-serialization-json")
          ktor_ver = get_latest_maven("io.ktor", "ktor-client-core")
          genai_ver = get_latest_maven("com.google.genai", "google-genai")

          # 1. Содержимое libs.versions.toml
          toml_content = textwrap.dedent(f"""\
          [versions]
          kotlin = "{kotlin_ver}"
          coroutines = "{coroutines_ver}"
          serialization = "{serialization_ver}"
          ktor = "{ktor_ver}"
          google-genai = "{genai_ver}"

          [libraries]
          kotlinx-coroutines-core = {{ module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }}
          kotlinx-serialization-json = {{ module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }}

          ktor-client-core = {{ module = "io.ktor:ktor-client-core", version.ref = "ktor" }}
          ktor-client-cio = {{ module = "io.ktor:ktor-client-cio", version.ref = "ktor" }}
          ktor-client-content-negotiation = {{ module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }}
          ktor-serialization-kotlinx-json = {{ module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }}

          google-genai = {{ module = "com.google.genai:google-genai", version.ref = "google-genai" }}

          [plugins]
          kotlin-jvm = {{ id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }}
          kotlin-serialization = {{ id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }}
          """)

          # 2. Содержимое SUMMARY.md
          summary_content = textwrap.dedent(f"""\
          # 🚀 Новейший стек для Kotlin Gemini 3.8 Flash Client

          | Инструмент / Библиотека | Назначение | Актуальная версия |
          | :--- | :--- | :--- |
          | **Gradle** | Сборщик проекта | `{gradle_ver}` |
          | **Kotlin** | Язык разработки | `{kotlin_ver}` |
          | **Kotlinx Coroutines** | Асинхронность / Flow | `{coroutines_ver}` |
          | **Kotlinx Serialization** | Сериализация JSON | `{serialization_ver}` |
          | **Ktor Client** | HTTP / SSE стриминг | `{ktor_ver}` |
          | **Google GenAI SDK** | Официальный Java/Kotlin SDK | `{genai_ver}` |

          ### 🛠 Команда обновления Gradle Wrapper:
          ```bash
          ./gradlew wrapper --gradle-version {gradle_ver} --distribution-type all
          ```

          ---
          ### 📄 Содержимое сгенерированного libs.versions.toml:
          ```toml
          {toml_content}
          ```
          """)

          # Создаем папку и сохраняем оба файла
          out_dir = Path("generated")
          out_dir.mkdir(parents=True, exist_ok=True)

          with open(out_dir / "libs.versions.toml", "w", encoding="utf-8") as f:
              f.write(toml_content)

          with open(out_dir / "SUMMARY.md", "w", encoding="utf-8") as f:
              f.write(summary_content)

          # Также дублируем в GitHub Step Summary
          summary_path = os.getenv('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write(summary_content)
          EOF

      - name: Upload configuration and summary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-gemini-stack-report
          path: generated/